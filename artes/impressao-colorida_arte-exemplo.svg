<svg xmlns="http://www.w3.org/2000/svg" width="100mm" height="150mm" viewBox="0 0 100 150">
  <!-- Exemplo de arte colorida de cliente (marca inventada), face 10 x 15 cm, área segura 8 mm -->
  <defs>
    <style>
      .t{font-family:Poppins;font-weight:700;text-anchor:middle}
    </style>
  </defs>
  <text class="t" x="50" y="25" font-size="7.2" fill="#C59A3E" letter-spacing="1.2">CASA</text>
  <text class="t" x="50" y="43" font-size="17.5" fill="#1F6A73" letter-spacing="0.3">MIRANTE</text>
  <g fill="#C59A3E">
    <rect x="17" y="47.6" width="9" height="0.9" rx="0.45"/>
    <rect x="74" y="47.6" width="9" height="0.9" rx="0.45"/>
  </g>
  <text class="t" x="50" y="49.7" font-size="4.3" fill="#C59A3E" letter-spacing="0.6">DRIP COFFEE</text>
  <text class="t" x="50" y="57" font-size="4.6" fill="#1E2B45">CAFÉ ESPECIAL · 10 g</text>
  <text class="t" x="50" y="61.6" font-size="3.1" fill="#1F6A73" font-weight="500" letter-spacing="0.3">BOAS-VINDAS AO SEU QUARTO</text>

  <!-- ilustração: xícara com o drip encaixado -->
  <g transform="translate(50 87.5) scale(0.82)">
    <!-- vapor -->
    <g fill="none" stroke="#C59A3E" stroke-width="1.1" stroke-linecap="round">
      <path d="M-5 -20 c-2 -3 2 -5 0 -8"/>
      <path d="M1 -21 c-2 -3 2 -5 0 -8"/>
      <path d="M7 -20 c-2 -3 2 -5 0 -8"/>
    </g>
    <!-- sachê de filtro atrás -->
    <path d="M-11 -16 L11 -16 L9 -2 L-9 -2 Z" fill="#D8B57E" stroke="#1E2B45" stroke-width="0.9" stroke-linejoin="round"/>
    <path d="M-11 -16 L-15 -9 L-11 -5" fill="#EFE3CC" stroke="#1E2B45" stroke-width="0.9" stroke-linejoin="round"/>
    <path d="M11 -16 L15 -9 L11 -5" fill="#EFE3CC" stroke="#1E2B45" stroke-width="0.9" stroke-linejoin="round"/>
    <!-- xícara -->
    <path d="M-17 -6 L17 -6 L15 9 Q14 16 7 16 L-7 16 Q-14 16 -15 9 Z" fill="#F4EAD6" stroke="#1E2B45" stroke-width="1" stroke-linejoin="round"/>
    <ellipse cx="0" cy="-6" rx="17" ry="3.2" fill="#6B3E22" stroke="#1E2B45" stroke-width="1"/>
    <path d="M16.3 -1.5 q8 0 7 7 q-1 6 -9 5" fill="none" stroke="#1E2B45" stroke-width="1"/>
    <path d="M16.3 0.8 q5 0 4.4 4.6 q-0.6 3.6 -6 3.3" fill="none" stroke="#1F6A73" stroke-width="1.4"/>
    <!-- faixa da xícara -->
    <path d="M-16.2 2 L16.2 2 L15.8 5 L-15.8 5 Z" fill="#1F6A73"/>
    <!-- pires -->
    <ellipse cx="0" cy="17.5" rx="24" ry="3.4" fill="#C59A3E" stroke="#1E2B45" stroke-width="0.9"/>
  </g>

  <text class="t" x="50" y="113" font-size="4.8" fill="#1E2B45">SUL DE MINAS · ORIGEM ÚNICA</text>
  <g fill="none" stroke="#1E2B45" stroke-width="0.45">
    <rect x="17" y="116.2" width="33" height="5.4"/>
    <rect x="50" y="116.2" width="33" height="5.4"/>
  </g>
  <text class="t" x="33.5" y="120" font-size="2.7" fill="#1E2B45" font-weight="500">TORRA MÉDIA</text>
  <text class="t" x="66.5" y="120" font-size="2.7" fill="#1E2B45" font-weight="500">100% ARÁBICA</text>

  <!-- selo da marca -->
  <g transform="translate(37 128)">
    <path d="M0 8 L5 1 L8 4.5 L10.5 2 L15 8 Z" fill="#1F6A73"/>
    <path d="M5 1 L6.6 3.2 L5 4.2 L3.6 3.1 Z" fill="#F4EAD6"/>
    <circle cx="13" cy="2" r="1.4" fill="#C59A3E"/>
  </g>
  <text x="54" y="132.2" font-family="Poppins" font-weight="700" font-size="3.3" fill="#1F6A73">CASA</text>
  <text x="54" y="136" font-family="Poppins" font-weight="700" font-size="3.3" fill="#C59A3E">MIRANTE</text>
</svg>
